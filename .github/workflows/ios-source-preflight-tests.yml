name: PlayTorrio iOS source preflight (tests only)

# Only a deliberate request-file push or manual dispatch starts this workflow.
# This job never runs flutter build, Xcode archive, IPA signing or packaging.
on:
  push:
    branches: [parity-floating-player-both]
    paths: ['.github/ios-source-preflight-request.txt']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-source-preflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ios-source-preflight:
    name: Analyze and test staged iOS code without producing an IPA
    runs-on: macos-15-intel
    timeout-minutes: 75
    steps:
      - name: Checkout the exact requested source
        uses: actions/checkout@v4

      - name: Verify checkout SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Setup Flutter SDK matching release workflow
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Resolve Dart and Flutter dependencies
        shell: bash
        run: |
          set -euo pipefail
          touch .env
          flutter --version
          flutter pub get

      - name: Analyze iOS entrypoint, Live TV, remote handoff and Stremio clients
        shell: bash
        run: |
          set -euo pipefail
          flutter analyze --no-pub --no-fatal-infos \
            lib/main.dart \
            lib/models/addon/addon.dart \
            lib/models/movie/video.dart \
            lib/models/stream/stream_model.dart \
            lib/services/player/live_tv \
            lib/services/remote/lan_cast_request.dart \
            lib/services/remote/lan_remote_service.dart \
            lib/services/remote/unattended_test_activity.dart \
            lib/widgets/remote/unattended_test_indicator.dart \
            lib/services/remote/github_diagnostic_control.dart \
            lib/services/remote/torriodb_write_queue.dart \
            lib/services/stream/stream_service.dart \
            lib/services/metadata/metadata_service.dart \
            lib/pages/catalog/catalog_page.dart \
            lib/widgets/remote/play_on_ipad_sheet.dart

      - name: Test critical iOS media, addon and cross-device regressions
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            test/stremio_protocol_compatibility_test.dart
            test/addon_metadata_recovery_test.dart
            test/live_tv_stream_isolation_test.dart
            test/live_tv_recovery_test.dart
            test/live_tv_diagnostics_test.dart
            test/live_tv_quality_of_life_test.dart
            test/live_tv_hls_probe_test.dart
            test/live_tv_hls_http_relay_test.dart
            test/live_tv_experiment_policy_test.dart
            test/live_tv_matrix_runner_test.dart
            test/live_channel_health_scanner_test.dart
            test/live_verified_source_preference_test.dart
            test/live_verified_source_learning_gate_test.dart
            test/live_unattended_native_probe_request_test.dart
            test/unattended_test_activity_test.dart
            test/unattended_test_indicator_widget_test.dart
            test/lan_remote_protocol_test.dart
            test/lan_cast_request_test.dart
            test/torriodb_write_queue_test.dart
            test/github_diagnostic_control_test.dart
            test/github_stremio_addon_probe_test.dart
            test/source_content_identity_test.dart
            test/watch_source_preferences_test.dart
            test/playback_autoselection_test.dart
            test/playback_source_recovery_test.dart
            test/debrid_source_readiness_test.dart
            test/episode_completion_policy_test.dart
            test/series_automatic_skip_test.dart
            test/see_all_source_integrity_test.dart
            test/ios_audio_telemetry_test.dart
            test/ios_source_audio_diagnostics_test.dart
            test/ios_speech_network_consent_test.dart
          )
          for test_file in "${tests[@]}"; do
            echo "::group::$test_file"
            flutter test --no-pub "$test_file"
            echo "::endgroup::"
          done

      - name: Test entire existing Flutter suite
        shell: bash
        run: |
          set -euo pipefail
          flutter test --no-pub test

      - name: Confirm no IPA or application was built
        shell: bash
        run: |
          set -euo pipefail
          if [ -d build/ios/ipa ]; then
            echo "Unexpected iOS IPA output directory" >&2
            exit 1
          fi
          echo "Source tests completed. No platform build or signed IPA requested."
