            lib/services/stream/watch_source_preferences.dart \
            lib/models/stream/stream_model.dart \
            lib/pages/settings/watch_source_preferences_page.dart \
            lib/services/player/player_diagnostic_codes.dart \
            lib/services/metadata/tmdb_discover_service.dart \
            lib/services/metadata/title_origin_language_service.dart lib/services/metadata/series_run_service.dart lib/widgets/movie/series_year_label.dart \
            lib/models/movie/movie_detail.dart \
            lib/models/movie/video.dart \
            lib/pages/discover/discover_page.dart \
            lib/services/metadata/network_discover_service.dart \
            lib/pages/networks/networks_page.dart \
            lib/services/theme/dock_settings.dart \
            lib/widgets/common/app_liquid_dock.dart \
            lib/services/metadata/tvdb_series_service.dart \
            lib/services/metadata/similar_recommendations_service.dart \
            lib/pages/details/person_credits_page.dart \
            lib/pages/settings/tvdb_settings_page.dart \
            lib/pages/search/advanced_discover_page.dart \
            lib/pages/search/search_page.dart \
            lib/pages/details/details_page.dart

      - name: Analyze speech-timing services and player integration
        run: flutter analyze --no-pub --no-fatal-infos lib/services/player/ios_speech_transcriber.dart lib/services/player/mpv_speech_audio_capture.dart lib/services/player/speech_subtitle_alignment.dart lib/pages/player/player_screen.dart

      - name: Verify isolated Live TV recovery, signal UI and iPad diagnostics
        run: |
          flutter analyze --no-pub --no-fatal-infos lib/services/player/live_tv lib/widgets/player/live_tv_overlay.dart lib/widgets/player/player_transport.dart lib/services/player/ios_audio_telemetry.dart lib/pages/player/player_screen.dart lib/services/stream/stream_service.dart lib/services/player/player_settings.dart
          flutter test test/live_tv_recovery_test.dart
          flutter test test/live_tv_quality_of_life_test.dart
          flutter test test/live_tv_diagnostics_test.dart
          flutter test test/live_tv_stream_isolation_test.dart
          flutter test test/live_tv_hls_probe_test.dart
          flutter test test/live_tv_hls_http_relay_test.dart
          flutter test test/live_tv_experiment_policy_test.dart
          flutter test test/live_tv_matrix_runner_test.dart
          flutter analyze --no-pub --no-fatal-infos lib/services/remote/github_diagnostic_control.dart lib/services/remote/github_stremio_addon_probe.dart lib/services/player/live_tv/live_source_manager.dart lib/services/player/live_tv/live_playback_coordinator.dart lib/main.dart lib/pages/player/player_screen.dart lib/pages/settings/settings_page.dart
          flutter test test/github_diagnostic_control_test.dart
          flutter test test/github_stremio_addon_probe_test.dart

      # The next IPA must not package untested staged features. These
      # source-level regressions run before any native iOS archive/sign step.
      - name: Gate native release on Live TV scan, source learning and iPhone cast
        run: |
          flutter analyze --no-pub --no-fatal-infos lib/services/player/live_tv lib/services/remote/lan_cast_request.dart lib/services/remote/lan_remote_service.dart lib/widgets/remote/play_on_ipad_sheet.dart lib/pages/catalog/catalog_page.dart lib/main.dart
          flutter test test/live_channel_health_scanner_test.dart
          flutter test test/live_verified_source_preference_test.dart
          flutter test test/live_verified_source_learning_gate_test.dart
          flutter test test/live_unattended_native_probe_request_test.dart
          flutter test test/unattended_test_activity_test.dart
          flutter analyze --no-pub --no-fatal-infos lib/services/remote/ios_adhoc_diagnostic_plan.dart
          flutter test test/ios_adhoc_diagnostic_plan_test.dart
          flutter analyze --no-pub --no-fatal-infos lib/services/remote/ios_adhoc_diagnostic_coordinator.dart lib/services/remote/ios_diagnostic_journal.dart lib/services/remote/ios_network_diagnostic_probe.dart lib/services/remote/ios_media_diagnostic_request.dart lib/services/player/ios_native_process_metrics.dart
          flutter test test/ios_adhoc_diagnostic_coordinator_test.dart
          flutter test test/ios_diagnostic_journal_test.dart
          flutter test test/ios_network_diagnostic_probe_test.dart
          flutter test test/ios_media_diagnostic_request_test.dart
          flutter test test/ios_native_process_metrics_test.dart
          flutter test test/unattended_test_indicator_widget_test.dart
          flutter test test/ios_remote_diagnostic_inventory_test.dart
          flutter test test/lan_cast_request_test.dart
          flutter test test/torriodb_write_queue_test.dart

      - name: Analyze iPhone and iPad LAN remote integration
        run: flutter analyze --no-pub --no-fatal-infos lib/main.dart lib/services/remote/lan_remote_service.dart lib/pages/remote/remote_control_page.dart lib/widgets/movie/movie_card.dart lib/widgets/home/continue_watching_slider.dart lib/widgets/movie/movie_slider_section.dart lib/widgets/common/liquid_dock.dart lib/pages/player/player_screen.dart lib/pages/settings/settings_page.dart

      - name: Test LAN remote protocol and pairing restrictions
        run: flutter test test/lan_remote_protocol_test.dart

      - name: Test GitHub library and cross-device playback progress
        run: |
          flutter test test/github_progress_merge_test.dart
          flutter test test/github_progress_v1_compat_test.dart
          flutter test test/github_sync_gate_test.dart
          flutter test test/torriodb_portable_sync_test.dart
          flutter test test/source_compatibility_rank_test.dart
          flutter test test/playback_metric_sanitizer_test.dart
          flutter test test/player_debug_telemetry_test.dart
           flutter test test/stremio_protocol_compatibility_test.dart
           flutter test test/addon_metadata_recovery_test.dart
          flutter test test/ios_audio_telemetry_test.dart
          flutter test test/player_audio_presets_test.dart
          flutter test test/paused_http_recovery_test.dart
          flutter test test/watched_history_recommendations_test.dart
          flutter test test/watch_source_preferences_test.dart
          flutter test test/watch_source_toolbar_layout_test.dart
          flutter test test/home_section_order_test.dart
          flutter test test/github_watched_history_merge_test.dart
          flutter test test/github_watchlist_v1_regression_test.dart
          flutter test test/github_library_merge_test.dart
          flutter test test/services/my_list_service_test.dart

      - name: Test TV Series vs Movie recommendations on iOS
        run: flutter test test/recommendation_media_type_test.dart

      - name: Verify TVDB key option is discoverable in iOS Settings
        run: flutter test test/tvdb_settings_navigation_test.dart

      - name: Validate TVDB key probe, completed history and TMDB personalized fallback
        run: |
          flutter test test/tvdb_credentials_validation_test.dart
          flutter test test/watched_history_recommendations_test.dart
          flutter test test/connected_catalog_history_bridge_test.dart
          flutter test test/tmdb_personalized_fallback_test.dart

      - name: Test optional movie and TV title search with combined filters
        run: |
          flutter test test/tmdb_text_filter_search_test.dart
          flutter test test/advanced_discover_text_ui_test.dart

      - name: Test cast-person filmography and rich similar-card metadata
        run: |
          flutter test test/person_filmography_test.dart
          flutter test test/similar_card_metadata_test.dart
          flutter test test/similar_navigation_resolution_test.dart
          flutter test test/cast_similar_navigation_ui_test.dart

      - name: Test streaming service and TV networks browsing
        run: |
          flutter test test/network_discover_service_test.dart
          flutter test test/networks_navigation_ui_test.dart

      - name: Test genuine source-bound See All on iOS
        run: |
          flutter test test/curated_recommendations_see_all_test.dart
          flutter test test/see_all_source_integrity_test.dart
          flutter test test/title_origin_language_test.dart
          flutter test test/origin_language_everywhere_test.dart

      - name: Test player and Continue Watching Show Details actions
        run: flutter test test/show_details_navigation_test.dart

      - name: Test shared debrid placeholder source fallback on iOS
        run: |
          flutter test test/playback_source_recovery_test.dart
          flutter test test/debrid_source_readiness_test.dart

      - name: Test spoken-word audio-to-subtitle timing
        run: flutter test test/speech_subtitle_alignment_test.dart

      - name: Test Apple Speech online consent guard
        run: flutter test test/ios_speech_network_consent_test.dart

      - name: Test mpv decoded stream WAV format and safe native file handoff
        run: flutter test test/mpv_speech_audio_capture_test.dart

      - name: Check iOS Speech transcription and permission wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          app=Path('ios/Runner/AppDelegate.swift').read_text()
          player=Path('lib/pages/player/player_screen.dart').read_text()
          plist=Path('ios/Runner/Info.plist').read_text()
          assert 'SFSpeechURLRecognitionRequest' in app
          assert 'if let audioURL = decodedWav' in app
          assert 'filename.hasPrefix("playtorrio-speech-")' in app
          assert "error.code != 'audio_extract_failed'" in Path('lib/services/player/ios_speech_transcriber.dart').read_text()
          assert "await wav.delete()" in Path('lib/services/player/ios_speech_transcriber.dart').read_text()
          assert "await mpv.setProperty('ao', 'pcm')" in Path('lib/services/player/mpv_speech_audio_capture.dart').read_text()

          assert 'request.requiresOnDeviceRecognition = onDeviceOnly' in app
          assert 'let onDeviceOnly = offlineSupported && !allowAppleNetworkRecognition' in app
          assert 'if !offlineSupported && !allowAppleNetworkRecognition' in app
          assert 'request.requiresOnDeviceRecognition = onDeviceOnly' in app
          assert 'code: "network_required"' in app
          assert 'offline_recognition_failed' in app
          assert 'allowAppleNetworkRecognition: allowAppleNetworkRecognition' in app
          assert 'Use Apple online Speech Recognition?' in player
          assert "if (approved != true)" in player
          assert "allowAppleNetworkRecognition: true" in player
          assert 'NSSpeechRecognitionUsageDescription' in plist
          assert 'SpeechSubtitleAlignment.estimate(' in player
          assert 'var desiredDelay = estimate.delaySeconds;' in player
          assert 'final applied = await _applyLiveDelay(desiredDelay);' in player
          PY

      - name: Verify cancelable TV intro and credits auto-skip
        run: flutter test test/series_automatic_skip_test.dart

      - name: Verify playback diagnostics overlay
        run: flutter test test/player_diagnostics_overlay_test.dart

      - name: Test English-audio priority
        run: flutter test test/audio_language_priority_test.dart

      - name: Test English subtitles and continuous episode selection
        run: flutter test test/playback_autoselection_test.dart

      - name: Check nested details history and Discover scroll preservation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          details = Path('lib/pages/details/details_page.dart').read_text()
          discover = Path('lib/pages/search/advanced_discover_page.dart').read_text()
          assert 'Navigator.pushReplacement(' not in details, 'Details page replaces its history'
          assert 'Navigator.push(' in details
          assert 'controller: _discoverScroll' in discover
          assert '_discoverScroll.animateTo(' not in discover
          assert 'if (loading && !applied)' in discover, 'Initial loading feedback missing'
          assert 'openingId == item.tmdbId' in discover, 'Per-card immediate spinner missing'
          assert 'if ((loading && !applied) || openingId != null)' not in discover, 'Global loading would shift grid'
          assert 'PageStorageKey' in discover
          print('Nested details history and stable pagination verified')
          PY

      - name: Test TMDB Discover filters and year matching
        run: |
          flutter test test/tmdb_advanced_discover_test.dart
          flutter test test/source_availability_service_test.dart
          flutter test test/tmdb_text_filter_search_test.dart
          flutter test test/tmdb_trending_strict_filters_test.dart
          flutter test test/series_run_service_test.dart
          flutter test test/discover_year_pagination_widget_test.dart

      - name: Test polite TV recommendations and optional TVDB enrichment
        run: |
          flutter test test/tmdb_rate_limit_test.dart
          flutter test test/similar_recommendations_test.dart

      - name: Test current shared Night Mode, playback recovery and debug privacy on iOS source
        run: |
          flutter test test/player_picture_audio_test.dart
          flutter test test/night_mode_diagnostics_test.dart
          flutter test test/ios_audio_telemetry_test.dart
          flutter test test/playback_frame_health_test.dart

      - name: Verify iPad playback performance and private telemetry parity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          player = Path('lib/pages/player/player_screen.dart').read_text()
          settings = Path('lib/services/player/player_settings.dart').read_text()
          telemetry = Path('lib/services/player/ios_audio_telemetry.dart').read_text()
          discover = Path('lib/pages/search/advanced_discover_page.dart').read_text()
          assert 'IosAudioTelemetry.instance.capturePlaybackSample(' in player
          assert 'IosAudioTelemetry.instance.upload(' in player
          assert 'const Duration(seconds: 5)' in player
          assert '_logoAnimController.stop(canceled: false)' in player
          assert "await platform.setProperty('video-sync', 'audio')" in settings
          assert "'framedrop': 'vo'" in settings
          assert "'interpolation': 'no'" in settings
          assert "MPVLogLevel.warn" in settings
          assert 'playback_frame_drops' in telemetry
          assert 'slowBuild >= 3' in telemetry
          assert 'worstRasterMs >= 75' in telemetry
          assert 'performanceSamples' in telemetry
          assert 'if (!isActive) return;' in telemetry
          assert '_minUploadInterval = Duration(seconds: 30)' in telemetry
          assert 'openingId == item.tmdbId' in discover
          assert 'showUnreleased:' in discover
          PY

      - name: Verify iPad Xperience and BingeCat catalog trial
        run: |
          flutter analyze --no-pub --no-fatal-infos lib/models/addon/addon.dart lib/services/addon/addon_manager.dart lib/services/addon/personalized_catalog_providers.dart lib/services/metadata/metadata_service.dart lib/pages/settings/addons_settings_page.dart
          flutter test test/personalized_catalog_ios_trial_test.dart

      - name: Build unsigned iOS 15 release
        run: flutter build ios --no-pub --release --no-codesign --build-name=1.1.15 --build-number="$SPEECH_BUILD_NUMBER" --dart-define=PLAYTORRIO_COMMIT="${{ github.sha }}" --dart-define=PLAYTORRIO_RUN="$SPEECH_BUILD_NUMBER" --dart-define-from-file=.env

      - name: Reverify FFmpeg compressor framework inside BUILT iOS app before signing
        run: |
          python3 .github/scripts/prepare_ios_night_mode_libmpv.py --verify
          python3 .github/scripts/prepare_ios_night_mode_libmpv.py --verify-app

      - name: Verify minimum iOS 15
        run: |
          test -d build/ios/iphoneos/Runner.app
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          info = Path('build/ios/iphoneos/Runner.app/Info.plist')
          with info.open('rb') as f:
              version = plistlib.load(f).get('MinimumOSVersion', '')
          print('App minimum iOS version:', version)
          if not version or tuple(map(int, version.split('.'))) > (15, 0):
              raise SystemExit('Build is not compatible with iOS 15')
          PY

      - name: Ad hoc sign for TrollStore
        run: |
          codesign --force --deep --sign - --timestamp=none build/ios/iphoneos/Runner.app
          codesign --verify --deep --strict --verbose=2 build/ios/iphoneos/Runner.app

      - name: Package IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -qry PlayTorrio-iOS15-TrollStore.ipa Payload
          test -s PlayTorrio-iOS15-TrollStore.ipa

      - name: Verify TrollStore IPA archive and app signing
        run: |
          python3 - <<'PY'
          import hashlib, plistlib, zipfile
          from pathlib import Path
          ipa = Path('build/ios/ipa/PlayTorrio-iOS15-TrollStore.ipa')
          if not ipa.is_file() or ipa.stat().st_size == 0:
              raise SystemExit('Missing IPA archive')
          with zipfile.ZipFile(ipa) as archive:
              if archive.testzip() is not None:
                  raise SystemExit('IPA archive is corrupt')
              names = archive.namelist()
              info = plistlib.loads(archive.read('Payload/Runner.app/Info.plist'))
              minimum = tuple(map(int, info['MinimumOSVersion'].split('.')))
              if minimum > (15, 0):
                  raise SystemExit(f'IPA requires iOS {minimum}, not compatible with iOS 15.0')
              if 2 not in info['UIDeviceFamily']:
                  raise SystemExit('IPA does not support iPad')
              if 'Payload/Runner.app/_CodeSignature/CodeResources' not in names:
                  raise SystemExit('Missing ad hoc code signature in packaged IPA')
              print('IPA bundle:', info['CFBundleIdentifier'])
              print('Minimum iOS:', info['MinimumOSVersion'])
              print('iOS build number:', info['CFBundleVersion'])
          print('SHA256:', hashlib.sha256(ipa.read_bytes()).hexdigest())
          PY

      # The GitHub artifact service can time out creating an artifact even after
      # Flutter, signing, and IPA integrity verification have all succeeded.
      # Retry the artifact upload IN THIS JOB so a transient service outage
      # does not force an unnecessary native rebuild or bypass signing checks.
      - name: Upload signed iOS 15 TrollStore IPA (attempt 1 of 4)
        id: ios_ipa_upload_1
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: PlayTorrio-iOS15-SpeechSync-v1.1.15-run-${{ github.run_number }}
          path: build/ios/ipa/PlayTorrio-iOS15-TrollStore.ipa
          if-no-files-found: error
          retention-days: 3
      - name: Wait before iOS artifact upload attempt 2
        if: ${{ steps.ios_ipa_upload_1.outcome == 'failure' }}
        run: sleep 20
      - name: Retry signed iOS 15 TrollStore IPA upload (attempt 2 of 4)
        id: ios_ipa_upload_2
        if: ${{ steps.ios_ipa_upload_1.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: PlayTorrio-iOS15-SpeechSync-v1.1.15-run-${{ github.run_number }}
          path: build/ios/ipa/PlayTorrio-iOS15-TrollStore.ipa
          if-no-files-found: error
          retention-days: 3
          overwrite: true
      - name: Wait before iOS artifact upload attempt 3
        if: ${{ steps.ios_ipa_upload_2.outcome == 'failure' }}
        run: sleep 45
      - name: Retry signed iOS 15 TrollStore IPA upload (attempt 3 of 4)
        id: ios_ipa_upload_3
        if: ${{ steps.ios_ipa_upload_2.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: PlayTorrio-iOS15-SpeechSync-v1.1.15-run-${{ github.run_number }}
          path: build/ios/ipa/PlayTorrio-iOS15-TrollStore.ipa
          if-no-files-found: error
          retention-days: 3
          overwrite: true
      - name: Wait before final iOS artifact upload attempt
        if: ${{ steps.ios_ipa_upload_3.outcome == 'failure' }}
        run: sleep 90
      - name: Final signed iOS 15 TrollStore IPA upload (attempt 4 of 4)
        if: ${{ steps.ios_ipa_upload_3.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: PlayTorrio-iOS15-SpeechSync-v1.1.15-run-${{ github.run_number }}
          path: build/ios/ipa/PlayTorrio-iOS15-TrollStore.ipa
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  speech-primary-allocation-check:
    name: Verify no-runner cancellation of speech-ios-primary
    needs: [speech-ios-primary]
    if: ${{ always() && !cancelled() && needs.speech-ios-primary.result == 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      actions: read
      contents: read
    outputs:
      eligible: ${{ steps.guard.outputs.eligible }}
    steps:
      - uses: actions/checkout@v4
      - name: Guard against duplicate builds and app failures
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_JOB_NAME: "iOS Speech — primary Intel"
          ARTIFACT_NAME: "PlayTorrio-iOS15-SpeechSync-v1.1.15-run-${{ github.run_number }}"
          RELEASE_TAG: "ios-speech-v1.1.15-run${{ github.run_number }}"
        run: python3 .github/scripts/ios_runner_fallback_guard.py

  speech-ios-rescue-intel:
    name: iOS Speech — backup Intel
    needs: [speech-ios-primary, speech-primary-allocation-check]
    if: ${{ always() && !cancelled() && needs.speech-primary-allocation-check.outputs.eligible == 'true' }}
    runs-on: macos-26-intel
    timeout-minutes: 100
    steps: *speech_ios_steps

  speech-intel-allocation-check:
    name: Verify no-runner cancellation of backup Intel
    needs: [speech-ios-rescue-intel]
    if: ${{ always() && !cancelled() && needs.speech-ios-rescue-intel.result == 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      actions: read
      contents: read
    outputs:
      eligible: ${{ steps.guard.outputs.eligible }}
    steps:
      - uses: actions/checkout@v4
      - name: Guard against unsafe native retry
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_JOB_NAME: "iOS Speech — backup Intel"
          ARTIFACT_NAME: "PlayTorrio-iOS15-SpeechSync-v1.1.15-run-${{ github.run_number }}"
          RELEASE_TAG: "ios-speech-v1.1.15-run${{ github.run_number }}"
        run: python3 .github/scripts/ios_runner_fallback_guard.py

  speech-ios-rescue-arm:
    name: iOS Speech — backup Apple Silicon
    needs: [speech-ios-rescue-intel, speech-intel-allocation-check]
    if: ${{ always() && !cancelled() && needs.speech-intel-allocation-check.outputs.eligible == 'true' }}
    runs-on: macos-15
    timeout-minutes: 100
    steps: *speech_ios_steps

  publish-ios-speech:
    name: Publish signed speech-sync iOS 15 IPA and checksums
    needs: [speech-ios-primary, speech-ios-rescue-intel, speech-ios-rescue-arm]
    if: ${{ always() && !cancelled() && (needs.speech-ios-primary.result == 'success' || needs.speech-ios-rescue-intel.result == 'success' || needs.speech-ios-rescue-arm.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    outputs:
      delivery_url: ${{ steps.publish_delivery.outputs.delivery_url }}
      release_published: ${{ steps.publish_delivery.outputs.release_published }}
    env:
      # An optional fine-grained PAT with releases/write can recover when
      # github.token is denied by the Releases API. Otherwise use the token.
      GH_TOKEN: ${{ secrets.IOS_RELEASE_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: PlayTorrio-iOS15-SpeechSync-v1.1.15-run-${{ github.run_number }}
          path: packages/ios15
      - name: Verify signed IPA, publish release or retain Actions artifact
        id: publish_delivery
        run: |
          set -euo pipefail
          BUILD_NUMBER=$((200 + GITHUB_RUN_NUMBER))
          TAG="ios-speech-v1.1.15-run$GITHUB_RUN_NUMBER"
          ASSET="PlayTorrio-v1.1.15-build$BUILD_NUMBER-iOS15-TrollStore.ipa"
          test -s packages/ios15/PlayTorrio-iOS15-TrollStore.ipa
          mkdir -p release
          cp packages/ios15/PlayTorrio-iOS15-TrollStore.ipa "release/$ASSET"
          python3 - <<'PY'
          import os,plistlib,zipfile
          with zipfile.ZipFile('packages/ios15/PlayTorrio-iOS15-TrollStore.ipa') as z:
              assert z.testzip() is None
              assert 'Payload/Runner.app/_CodeSignature/CodeResources' in z.namelist()
              info=plistlib.loads(z.read('Payload/Runner.app/Info.plist'))
              assert tuple(map(int,info['MinimumOSVersion'].split('.'))) <= (15,0)
              assert 2 in info['UIDeviceFamily']
              assert info['CFBundleVersion']==str(200+int(os.environ['GITHUB_RUN_NUMBER']))
          print('Ad hoc signed iOS 15 IPA verified')
          PY
          (cd release && sha256sum PlayTorrio-* > SHA256SUMS.txt)
          RELEASE_VISIBILITY="--latest"
          if grep -q '^PERSONALIZED_CATALOG_TRIAL' .github/ios-speech-release-request.txt; then
            RELEASE_VISIBILITY="--prerelease"
          fi
          {
            printf 'PlayTorrio iOS 15 — iPad catalog test — Build %s\n\n' "$BUILD_NUMBER"
            printf 'Source revision: %s\n' "$GITHUB_SHA"
            printf '%s\n' 'iOS-only Night Mode compressor packaging repair from shared source; Windows Build #170 stays unchanged.'
            printf "\nWhat's new / Fixed:\n"
            cat .github/release-notes.txt
            if [ "$RELEASE_VISIBILITY" = "--prerelease" ]; then
              printf '\nExperimental iPad catalog trial: iOS can upload completed private watch-history events through existing authorized Trakt OAuth. Xperience/BingeCat can read those only if already linked to that account. No hosted provider account or personal manifest is created automatically.\n'
            fi
          } > release-notes.md
          # The IPA has passed ZIP, signature, target OS and build-number checks.
          # A 403 from github-actions[bot] is a remote integration permission
          # refusal, not evidence that native compilation or signing failed.
          # Retry safe idempotent publication and never invent a release URL.
          publish_release_once() {
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              for file in release/*; do
                name=$(basename "$file")
                if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
                  --json assets --jq '.assets[].name' | grep -Fxq "$name"; then
                  gh release upload "$TAG" "$file" --repo "$GITHUB_REPOSITORY" --clobber || return 1
                fi
              done
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
                --notes-file release-notes.md || return 1
            else
              gh release create "$TAG" release/* \
                --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
                --title "PlayTorrio iOS 15 Full Player v1.1.15 (Build $BUILD_NUMBER)" \
                --notes-file release-notes.md "$RELEASE_VISIBILITY" || return 1
            fi
            for file in release/*; do
              name=$(basename "$file")
              expected=$(stat -c%s "$file")
              actual=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
                --json assets --jq ".assets[] | select(.name == \"$name\") | .size") || return 1
              test -n "$actual" && test "$expected" = "$actual" || return 1
            done
          }
          published=false
          for attempt in 1 2 3; do
            if publish_release_once; then
              published=true
              break
            fi
            echo "::warning::GitHub release publishing attempt $attempt denied or interrupted; signed artifact remains uploaded."
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 5))
            fi
          done
          if [ "$published" = true ]; then
            LINK="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$ASSET"
            echo "release_published=true" >> "$GITHUB_OUTPUT"
            echo "delivery_url=$LINK" >> "$GITHUB_OUTPUT"
            echo "Published and size-verified release: $LINK" >> "$GITHUB_STEP_SUMMARY"
          else
            LINK="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "release_published=false" >> "$GITHUB_OUTPUT"
            echo "delivery_url=$LINK" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Releases API denied publishing. Verified signed IPA is retained as the run artifact PlayTorrio-iOS15-SpeechSync-v1.1.15-run-$GITHUB_RUN_NUMBER."
            echo "Signed IPA validated; release publishing unavailable. Download the workflow artifact from: $LINK" >> "$GITHUB_STEP_SUMMARY"
          fi

  telegram-ios-speech:
    name: Send signed current-feature iOS 15 TrollStore IPA to Telegram
    needs: [speech-ios-primary, speech-ios-rescue-intel, speech-ios-rescue-arm, publish-ios-speech]
    if: ${{ always() && !cancelled() && needs.publish-ios-speech.result == 'success' && (needs.speech-ios-primary.result == 'success' || needs.speech-ios-rescue-intel.result == 'success' || needs.speech-ios-rescue-arm.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHANNEL_ID || vars.TELEGRAM_CHANNEL_ID || '-1003938575195' }}
      BUILD_SHA: ${{ github.sha }}
      BUILD_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      BUILD_VERSION: "1.1.15"
      IOS_DELIVERY_URL: ${{ needs.publish-ios-speech.outputs.delivery_url }}
      IOS_RELEASE_PUBLISHED: ${{ needs.publish-ios-speech.outputs.release_published }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: PlayTorrio-iOS15-SpeechSync-v1.1.15-run-${{ github.run_number }}
          path: packages/ios15
      - name: Send current-feature iOS 15 TrollStore release link
        # The signed IPA was verified and uploaded as a run artifact. A
        # permanent release link is only used if GitHub Releases succeeded.
        # Telegram is optional and must not invalidate a signed build.
        continue-on-error: true
        run: |
          set -euo pipefail
          export BUILD_NUMBER=$((200 + GITHUB_RUN_NUMBER))
          TAG="ios-speech-v1.1.15-run$GITHUB_RUN_NUMBER"
          ASSET="PlayTorrio-v1.1.15-build$BUILD_NUMBER-iOS15-TrollStore.ipa"
          test -s packages/ios15/PlayTorrio-iOS15-TrollStore.ipa
          LINK="$IOS_DELIVERY_URL"
          if [ "$IOS_RELEASE_PUBLISHED" = "true" ]; then
            MESSAGE="PlayTorrio iOS 15 Build #$BUILD_NUMBER: signed TrollStore IPA published and verified. Download: $LINK"
          else
            MESSAGE="PlayTorrio iOS 15 Build #$BUILD_NUMBER: signed IPA verified, but GitHub Releases publication was denied. Download the IPA from the GitHub Actions artifact: $LINK"
          fi
          python3 .github/scripts/telegram_ci.py --self-test
          python3 .github/scripts/telegram_ci.py send-text --text "$MESSAGE"
