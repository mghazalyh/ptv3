name: PlayTorrio iOS 15 Cache Cleaner IPA

on:
  push:
    branches:
      - ios15-storage-cleanup
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios15:
    name: Build unsigned IPA for iOS 15
    runs-on: macos-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Setup Flutter dependencies
        run: |
          touch .env
          flutter pub get

      - name: Restore iOS TorrServerKit framework
        run: |
          mkdir -p "$RUNNER_TEMP/torrserver-ios15"
          curl --fail --show-error --location --retry 3 \
            "https://github.com/MrSergo15/torrserver_flutter/releases/download/linux-macos-torrserver-fix-test/TorrServerKit.xcframework.zip" \
            -o "$RUNNER_TEMP/torrserver-ios15/TorrServerKit.xcframework.zip"
          unzip -t "$RUNNER_TEMP/torrserver-ios15/TorrServerKit.xcframework.zip" >/dev/null
          unzip -q "$RUNNER_TEMP/torrserver-ios15/TorrServerKit.xcframework.zip" \
            -d "$RUNNER_TEMP/torrserver-ios15"
          test -d "$RUNNER_TEMP/torrserver-ios15/TorrServerKit.xcframework"
          echo "TORRSERVER_FLUTTER_LOCAL_BINARIES=$RUNNER_TEMP/torrserver-ios15" >> "$GITHUB_ENV"

      - name: Inspect native framework platforms
        run: |
          python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path
          root = Path(os.environ['TORRSERVER_FLUTTER_LOCAL_BINARIES']) / 'TorrServerKit.xcframework'
          with (root / 'Info.plist').open('rb') as f:
              info = plistlib.load(f)
          print('Native framework slices:', info.get('AvailableLibraries'))
          if not any(
              entry.get('SupportedPlatform') == 'ios' and
              'arm64' in entry.get('SupportedArchitectures', []) and
              not entry.get('SupportedPlatformVariant')
              for entry in info.get('AvailableLibraries', [])
          ):
              raise SystemExit('TorrServerKit is missing iOS arm64 device support')
          PY

      - name: Analyze storage code
        run: |
          flutter analyze --no-pub --no-fatal-infos \
            lib/services/cache/storage_cache_service.dart \
            lib/pages/settings/storage_settings_page.dart \
            lib/services/config/settings_transfer_service.dart \
            lib/pages/settings/settings_transfer_page.dart \
            lib/pages/settings/torbox_quick_settings_page.dart \
            lib/pages/settings/settings_page.dart \
            lib/services/addon/addon_manager.dart

      - name: Build unsigned release
        run: flutter build ios --release --no-codesign --dart-define-from-file=.env

      - name: Verify minimum iOS 15
        run: |
          test -d build/ios/iphoneos/Runner.app
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          info = Path('build/ios/iphoneos/Runner.app/Info.plist')
          with info.open('rb') as f:
              version = plistlib.load(f).get('MinimumOSVersion', '')
          print('App minimum iOS version:', version)
          if not version or tuple(map(int, version.split('.'))) > (15, 0):
              raise SystemExit('Build is not compatible with iOS 15')
          PY

      - name: Ad hoc sign for TrollStore
        run: |
          codesign --force --deep --sign - --timestamp=none build/ios/iphoneos/Runner.app
          codesign --verify --deep --strict --verbose=2 build/ios/iphoneos/Runner.app

      - name: Package IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -qry PlayTorrio-iOS15-TorBox-TrollStore.ipa Payload
          test -s PlayTorrio-iOS15-TorBox-TrollStore.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlayTorrio-iOS15-TorBox-TrollStore
          path: build/ios/ipa/PlayTorrio-iOS15-TorBox-TrollStore.ipa
          if-no-files-found: error
