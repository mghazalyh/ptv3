name: PlayTorrio — lightweight Flutter quality gate
run-name: "PlayTorrio checks · ${{ github.ref_name }} · ${{ github.sha }}"

# Run ordinary development checks on inexpensive standard Linux runners.
# Documentation-only edits and explicit release requests cause no extra CI.
on:
  push:
    branches:
      - parity-floating-player-both
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/release-request.txt'
      - '.github/ios-release-archive-request.txt'
      - '.github/release-recovery-request.json'
      - '.github/workflows/playtorrio-recover-release.yml'
  pull_request:
    branches:
      - parity-floating-player-both
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
permissions:
  contents: read
concurrency:
  group: playtorrio-checks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  flutter-checks:
    name: Flutter analyzer + critical regression tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - name: Install app dependencies
        run: |
          printf '' > .env
          flutter pub get
      - name: Analyze shared components before any native release build
        run: |
          flutter analyze --no-pub --no-fatal-infos \
            lib/services/continue_watching \
            lib/services/my_list/github_library_cloud.dart \
            lib/models/my_list/my_list_item.dart \
            lib/services/home/home_page_settings.dart \
            lib/services/metadata/tmdb_discover_service.dart \
            lib/services/metadata/series_run_service.dart \
            lib/widgets/movie/series_year_label.dart \
            lib/pages/discover/discover_page.dart \
            lib/pages/search/advanced_discover_page.dart \
            lib/pages/search/search_page.dart \
            lib/widgets/movie/movie_slider_section.dart \
            lib/services/metadata/tvdb_series_service.dart \
            lib/models/movie/movie.dart \
            lib/pages/home/home_page.dart \
            lib/pages/details/details_page.dart \
            lib/pages/player/player_screen.dart \
            lib/pages/settings/settings_page.dart \
            lib/services/player/player_settings.dart \
            lib/services/player/player_picture_audio.dart \
            lib/services/config/windows_settings_recovery.dart \
            lib/services/player/windows_playback_telemetry.dart \
            lib/services/player/ios_audio_telemetry.dart \
            lib/services/player/ios_night_mode_preflight.dart \
            lib/services/player/night_mode_diagnostics.dart \
            lib/widgets/player/player_transport.dart \
            lib/widgets/player/player_brightness_menu.dart \
            lib/widgets/player/player_night_mode_recovery.dart \
            lib/services/player/paused_http_recovery.dart \
            lib/services/player/automatic_skip_policy.dart \
            lib/services/player/ios_speech_transcriber.dart \
            lib/services/player/mpv_speech_audio_capture.dart \
            lib/services/player/speech_subtitle_alignment.dart \
            lib/services/player/subtitle_auto_sync_platform.dart \
            lib/services/player/subtitle_auto_sync_policy.dart \
            lib/services/player/windows_whisper_transcriber.dart \
            lib/services/player/ffmpeg_speech_audio_capture.dart \
            lib/services/player/playback_diagnostics_probe.dart \
            lib/widgets/player/player_diagnostics_overlay.dart \
            lib/services/player/skip_segments_service.dart \
            lib/models/player/skip_segment_model.dart \
            lib/widgets/player/player_skip_button.dart \
            lib/widgets/movie/movie_card.dart \
            lib/pages/settings/github_library_settings_page.dart
      - name: Test cloud sync, recommendation correctness and platform-neutral playback policy
        shell: bash
        run: |
          set -euo pipefail
          for suite in \
            test/series_run_service_test.dart \
            test/discover_year_pagination_widget_test.dart \
            test/advanced_discover_text_ui_test.dart \
            test/tmdb_rate_limit_test.dart \
            test/tmdb_advanced_discover_test.dart \
            test/tmdb_text_filter_search_test.dart \
            test/tmdb_trending_strict_filters_test.dart \
            test/github_progress_merge_test.dart \
            test/github_progress_v1_compat_test.dart \
            test/github_sync_gate_test.dart \
            test/github_watched_history_merge_test.dart \
            test/watched_history_recommendations_test.dart \
            test/github_library_merge_test.dart \
            test/github_watchlist_v1_regression_test.dart \
            test/tvdb_credentials_validation_test.dart \
            test/tmdb_personalized_fallback_test.dart \
            test/curated_recommendations_see_all_test.dart \
            test/see_all_source_integrity_test.dart \
            test/audio_language_priority_test.dart \
            test/playback_autoselection_test.dart \
            test/speech_subtitle_alignment_test.dart \
            test/subtitle_auto_sync_platform_test.dart \
            test/subtitle_auto_sync_policy_test.dart \
            test/windows_whisper_transcriber_test.dart \
            test/ffmpeg_speech_audio_capture_test.dart \
            test/ios_speech_network_consent_test.dart \
            test/mpv_speech_audio_capture_test.dart \
            test/paused_http_recovery_test.dart \
            test/series_automatic_skip_test.dart \
            test/player_diagnostics_overlay_test.dart \
            test/player_picture_audio_test.dart \
            test/windows_settings_recovery_test.dart \
            test/windows_playback_telemetry_test.dart \
            test/playback_frame_health_test.dart \
            test/windows_video_pressure_guard_test.dart \
            test/playback_source_recovery_test.dart \
            test/night_mode_diagnostics_test.dart \
            test/ios_audio_telemetry_test.dart
          do
            flutter test "$suite"
          done
      - name: Verify iOS Apple Speech fallback actually honors network consent
        run: |
          python3 - <<'PY'
          from pathlib import Path
          native = Path("ios/Runner/AppDelegate.swift").read_text()
          player = Path("lib/pages/player/player_screen.dart").read_text()
          assert "let offlineSupported = recognizer.supportsOnDeviceRecognition" in native
          assert "let onDeviceOnly = offlineSupported && !allowAppleNetworkRecognition" in native
          assert "if !offlineSupported && !allowAppleNetworkRecognition" in native
          assert "request.requiresOnDeviceRecognition = onDeviceOnly" in native
          assert "if (approved != true)" in player
          assert "allowAppleNetworkRecognition: true" in player
          # Equivalent routing truth table: offline by default when available,
          # online ONLY when user explicitly consents for this one attempt.
          for available in (False, True):
              for consent in (False, True):
                  on_device_only = available and not consent
                  assert not (consent and on_device_only)
          print("Speech routing and explicit online consent guard verified")
          PY

      - name: Validate bounded iOS runner fallback without requesting a native build
        run: |
          python3 -m py_compile .github/scripts/ios_runner_fallback_guard.py .github/scripts/validate_native_release_workflow.py
          python3 .github/scripts/ios_runner_fallback_guard.py --self-test
          python3 .github/scripts/validate_native_release_workflow.py
          python3 -m py_compile .github/scripts/verify_night_mode_libmpv.py
          python3 .github/scripts/verify_night_mode_libmpv.py --self-test
          ruby -e 'require "yaml"; doc = YAML.load_file(".github/workflows/windows-advanced-discover.yml", aliases: true); abort "Invalid release workflow" unless doc.fetch("jobs").key?("ios15-rescue-arm")'
          ruby -e 'require "yaml"; d = YAML.load_file(".github/workflows/ios-speech-release.yml", aliases: true); j = d.fetch("jobs"); abort "Missing iOS speech release fallback" unless %w[speech-ios-primary speech-ios-rescue-intel speech-ios-rescue-arm publish-ios-speech telegram-ios-speech].all? { |name| j.key?(name) }; abort "Unexpected Windows build" if j.keys.any? { |name| name.include?("windows") }'

      - name: Validate retention pruning policy without GitHub deletion
        run: |
          python3 .github/scripts/prune_playtorrio_artifacts.py --self-test
          python3 .github/scripts/archive_ios_release.py --self-test
          python3 .github/scripts/telegram_ci.py --self-test
          python3 .github/scripts/watch_playtorrio_run.py --self-test

  windows-compatibility-smoke:
    name: Windows shared-player Auto Sync compatibility (no native package build)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - name: Install shared Flutter project dependencies
        shell: pwsh
        run: |
          Set-Content -LiteralPath ".env" -Value "" -Encoding utf8
          flutter pub get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Analyze Windows player including iOS-guarded optional Speech code
        shell: pwsh
        run: |
          flutter analyze --no-pub --no-fatal-infos lib/pages/player/player_screen.dart lib/widgets/player/player_transport.dart lib/services/player/subtitle_auto_sync_platform.dart lib/services/player/ios_speech_transcriber.dart lib/services/player/mpv_speech_audio_capture.dart lib/services/player/windows_whisper_transcriber.dart lib/services/player/ffmpeg_speech_audio_capture.dart lib/services/player/subtitle_auto_sync_policy.dart lib/services/player/player_picture_audio.dart lib/services/player/player_settings.dart lib/services/player/ios_audio_telemetry.dart lib/services/player/ios_night_mode_preflight.dart lib/services/player/playback_frame_health.dart lib/services/player/windows_video_pressure_guard.dart lib/services/player/playback_source_recovery.dart lib/services/player/night_mode_diagnostics.dart lib/widgets/player/player_night_mode_recovery.dart lib/pages/settings/settings_page.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test Windows release-matching and shared platform routing
        shell: pwsh
        run: |
          flutter test test/subtitle_auto_sync_platform_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test/subtitle_auto_sync_policy_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test/windows_whisper_transcriber_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test/ffmpeg_speech_audio_capture_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test/advanced_discover_text_ui_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test/tmdb_rate_limit_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test/player_picture_audio_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test/night_mode_diagnostics_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test/ios_audio_telemetry_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test/playback_frame_health_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test/windows_video_pressure_guard_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test/playback_source_recovery_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .github/scripts/verify_night_mode_libmpv.py --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test/playback_autoselection_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native Windows libmpv compressor preflight (no app package build)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $source = "https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261021/mpv-dev-x86_64-20261021-git-e471496c56.7z"
          $sha = "efc719eff3dc5954b4a5efc800632808bcec01cc9034940dd14e5eb7fe9ea633"
          $archive = Join-Path $env:RUNNER_TEMP "night-mode-full-filter-libmpv.7z"
          $expanded = Join-Path $env:RUNNER_TEMP "night-mode-full-filter-libmpv"
          Invoke-WebRequest -Uri $source -OutFile $archive -MaximumRedirection 8
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $sha) {
            throw "Pinned Windows libmpv preflight checksum mismatch"
          }
          $sevenZip = "C:/Program Files/7-Zip/7z.exe"
          if (!(Test-Path $sevenZip)) {
            $cmd = Get-Command 7z -ErrorAction SilentlyContinue
            if ($null -eq $cmd) { throw "No 7-Zip executable available" }
            $sevenZip = $cmd.Source
          }
          New-Item -Force -ItemType Directory -Path $expanded | Out-Null
          & $sevenZip x "-o$expanded" "-y" $archive | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Pinned Windows libmpv extraction failed" }
          $dlls = @(Get-ChildItem -LiteralPath $expanded -Recurse -File -Filter "libmpv-2.dll")
          if ($dlls.Count -ne 1) { throw "Expected exactly one pinned libmpv-2.dll" }
          $sample = Join-Path $env:RUNNER_TEMP "playtorrio-night-mode-synthetic.wav"
          python .github/scripts/verify_night_mode_libmpv.py --generate-sample "$sample"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .github/scripts/verify_night_mode_libmpv.py --libmpv $dlls[0].FullName --sample "$sample"
          if ($LASTEXITCODE -ne 0) { throw "Full-filter Windows MPV failed actual native Night Mode playback" }

