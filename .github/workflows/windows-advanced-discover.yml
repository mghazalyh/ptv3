name: PlayTorrio Windows — Floating Player and Sync Parity

on:
  push:
    branches:
      - ios15-advanced-discover
      - windows-trakt-sync-navigation
      - windows-simkl-hearts-sync
      - parity-floating-player-both
      - fix/windows-separate-player-controls
      - fix/windows-player-actions-all-modes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: playtorrio-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 — test, build, setup EXE
    runs-on: windows-latest
    steps:
      - name: Checkout shared iOS and Windows source
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Prepare key-free environment
        shell: pwsh
        run: |
          Set-Content -LiteralPath ".env" -Value "" -Encoding utf8
          flutter config --enable-windows-desktop
          flutter pub get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test API politeness, TV season discovery, and English audio
        shell: pwsh
        run: |
          flutter test test/tmdb_rate_limit_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test/tmdb_advanced_discover_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test/audio_language_priority_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test/trakt_merge_plan_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test/trakt_cloud_library_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test/simkl_hearts_cloud_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test/floating_playback_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test/player_video_surface_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test/player_window_actions_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test/services/my_list_service_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test/integration/my_list_flow_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Analyze modified shared app screens and services
        shell: pwsh
        run: |
          flutter analyze --no-pub --no-fatal-infos lib/services/metadata/tmdb_discover_service.dart lib/pages/search/advanced_discover_page.dart lib/pages/search/search_page.dart lib/services/cache/storage_cache_service.dart lib/services/config/settings_transfer_service.dart lib/pages/settings/torbox_quick_settings_page.dart lib/pages/settings/settings_transfer_page.dart lib/services/player/audio_language_priority.dart lib/pages/player/player_screen.dart lib/pages/player/watch_screen.dart lib/pages/details/details_page.dart lib/services/my_list/my_list_service.dart lib/services/my_list/trakt_cloud_library.dart lib/services/my_list/trakt_merge_plan.dart lib/services/trakt/trakt_service.dart lib/pages/my_list/my_list_page.dart lib/pages/settings/trakt_settings_page.dart lib/pages/settings/simkl_settings_page.dart lib/services/simkl/simkl_service.dart lib/services/storage/storage_service.dart lib/services/config/env_service.dart lib/services/my_list/simkl_hearts_cloud.dart lib/main.dart lib/services/player/floating_playback_service.dart lib/services/player/detached_playback_service.dart lib/widgets/player/player_window_actions.dart lib/pages/search/search_page.dart lib/pages/downloads/downloads_page.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Supply official verified TorrServer Windows binary
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "torrserver-official-windows"
          New-Item -Force -ItemType Directory -Path $dir | Out-Null
          $binary = Join-Path $dir "torrserver.exe"
          $url = "https://github.com/YouROK/TorrServer/releases/download/MatriX.147.1/TorrServer-windows-amd64.exe"
          Invoke-WebRequest -Uri $url -OutFile $binary -MaximumRedirection 8
          if (!(Test-Path $binary)) { throw "Official TorrServer binary download failed" }
          $sha = (Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne "e99ff2db56b3f43f66804ce0de6d199e3757dcc6062dba75974a462dad275a1c") {
            throw "Official TorrServer Windows binary SHA256 verification failed"
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "TORRSERVER_FLUTTER_LOCAL_BINARIES=$dir"
          Write-Host "Verified official Windows executable, staged for plugin packaging."

      - name: Verify nested details navigation and Discover scroll position
        shell: pwsh
        run: |
          $details = Get-Content "lib/pages/details/details_page.dart" -Raw
          $discover = Get-Content "lib/pages/search/advanced_discover_page.dart" -Raw
          if ($details.Contains("Navigator.pushReplacement(")) { throw "Nested details navigation replaces route" }
          if (!$discover.Contains("controller: _discoverScroll")) { throw "Discover scrolling was not carried over" }
          if (!$discover.Contains("oldMaxExtent + 160.0")) { throw "Load More scroll offset change missing" }
          $player = Get-Content "lib/pages/player/player_screen.dart" -Raw
          $viewer = Get-Content "lib/main.dart" -Raw
          $toolbar = Get-Content "lib/widgets/player/player_window_actions.dart" -Raw
          if ($player.Contains("onSeparateWindow: widget.onMinimize != null")) { throw "Window actions must not be gated behind optional callbacks" }
          if (!$player.Contains("onMinimize: _miniPlayerAction")) { throw "Mini action must be wired for every Windows player" }
          if (!$player.Contains("onSeparateWindow: () => unawaited(_separateWindowAction())")) { throw "Separate action must be wired for every Windows player" }
          if (!$viewer.Contains("detachedWindow: true")) { throw "Detached viewer window mode missing" }
          if (!$toolbar.Contains("required this.onSeparateWindow") -or !$toolbar.Contains("required this.onMinimize")) { throw "All Windows toolbar actions must be mandatory" }

      - name: Build Windows executable
        shell: pwsh
        run: |
          flutter build windows --release --dart-define-from-file=.env
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path "build/windows/x64/runner/Release/playtorrio.exe")) {
            throw "Windows executable was not created"
          }

      - name: Package portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "PlayTorrio-Windows-x64-Portable.zip" -Force
          if (!(Test-Path "PlayTorrio-Windows-x64-Portable.zip")) { throw "Portable ZIP missing" }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build direct Windows installer EXE
        shell: pwsh
        run: |
          $compiler = "C:/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if (!(Test-Path $compiler)) {
            $compiler = "C:/Program Files/Inno Setup 6/ISCC.exe"
          }
          if (!(Test-Path $compiler)) { throw "Inno Setup compiler missing" }
          New-Item -Force -ItemType Directory -Path "installer/windows/Output" | Out-Null
          & $compiler "/DMyAppVersion=1.0.8" "installer/windows/setup.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "installer/windows/Output/PlayTorrio-Windows-Setup.exe" "PlayTorrio-Windows-Setup.exe" -Force
          if (!(Test-Path "PlayTorrio-Windows-Setup.exe")) { throw "Installer missing" }

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: PlayTorrio-Windows-Floating-Player-Parity
          path: |
            PlayTorrio-Windows-Setup.exe
            PlayTorrio-Windows-x64-Portable.zip
          if-no-files-found: error

      - name: Publish direct Windows EXE and portable ZIP
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload ios15-advanced-discover-20261025 PlayTorrio-Windows-Setup.exe PlayTorrio-Windows-x64-Portable.zip --repo "${{ github.repository }}" --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $names = gh release view ios15-advanced-discover-20261025 --repo "${{ github.repository }}" --json assets --jq ".assets[].name"
          if ($names -notcontains "PlayTorrio-Windows-Setup.exe") { throw "Missing published installer" }
