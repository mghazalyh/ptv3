name: PlayTorrio v1.1.15 — Paired Windows and iOS 15 Builds
run-name: "PlayTorrio v1.1.15 · Build #${{ github.run_number }} · ${{ github.ref_name }}"

# Native packaging waits until the preceding native run has completed.
# Do not start another native build merely because source changes merge.
# Release requests are explicit and must be made only after the preceding
# iOS job and paired workflow have fully completed.
on:
  push:
    branches:
      - parity-floating-player-both
    paths:
      - '.github/release-request.txt'
      # Same native Windows job; iOS is deliberately skipped for Windows-only fixes.
      - '.github/windows-release-request.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: playtorrio-release-${{ github.ref }}
  # A newer push must never kill an expensive release build in progress.
  # Recovery stays inside this SAME workflow/run number; no duplicate paired job.
  cancel-in-progress: false

jobs:
  windows:
    name: Windows x64 — test, build, setup EXE
    if: github.ref == 'refs/heads/parity-floating-player-both'
    runs-on: windows-latest
    timeout-minutes: 100
    steps:
      - name: Checkout shared iOS and Windows source
        uses: actions/checkout@v4

      - name: Verify Windows checkout matches the triggering commit
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:GITHUB_SHA) { throw "Windows checkout SHA differs from workflow SHA" }
          Write-Host "Windows build commit: $actual"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Prepare key-free environment
        shell: pwsh
        run: |
          Set-Content -LiteralPath ".env" -Value "" -Encoding utf8
          flutter config --enable-windows-desktop
          flutter pub get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test API politeness, TV season discovery, and English audio
        shell: pwsh
        run: |
          flutter test test/tmdb_rate_limit_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test/similar_recommendations_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test/tvdb_settings_navigation_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test/tvdb_credentials_validation_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test/watched_history_recommendations_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test/tmdb_personalized_fallback_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test/tmdb_text_filter_search_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test/advanced_discover_text_ui_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test/person_filmography_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test/similar_card_metadata_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test/cast_similar_navigation_ui_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test/network_discover_service_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test/networks_navigation_ui_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test/tmdb_advanced_discover_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test/tmdb_text_filter_search_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test/tmdb_trending_strict_filters_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test/series_run_service_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test/discover_year_pagination_widget_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test/recommendation_media_type_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test/curated_recommendations_see_all_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test/see_all_source_integrity_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test/title_origin_language_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test/origin_language_everywhere_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test/show_details_navigation_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test/subtitle_auto_sync_policy_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test/windows_whisper_transcriber_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test/ffmpeg_speech_audio_capture_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test/player_picture_audio_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test/windows_settings_recovery_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test/windows_playback_telemetry_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test/night_mode_diagnostics_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test/playback_autoselection_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test/series_automatic_skip_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test/player_diagnostics_overlay_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test/paused_http_recovery_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test/audio_language_priority_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test/trakt_merge_plan_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test/trakt_cloud_library_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test/simkl_hearts_cloud_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test/github_progress_merge_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test/github_progress_v1_compat_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test/github_sync_gate_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test/github_watched_history_merge_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test/github_watchlist_v1_regression_test.dart
          flutter test test/series_automatic_skip_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test/player_diagnostics_overlay_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test/paused_http_recovery_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test/github_library_merge_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test/services/my_list_service_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test/integration/my_list_flow_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Analyze modified shared app screens and services
        shell: pwsh
        run: |
          flutter analyze --no-pub --no-fatal-infos lib/services/metadata/tmdb_discover_service.dart lib/services/metadata/title_origin_language_service.dart lib/services/metadata/series_run_service.dart lib/widgets/movie/series_year_label.dart lib/models/movie/movie_detail.dart lib/pages/discover/discover_page.dart lib/services/metadata/network_discover_service.dart lib/pages/networks/networks_page.dart lib/services/theme/dock_settings.dart lib/widgets/common/app_liquid_dock.dart lib/services/metadata/tvdb_series_service.dart lib/services/metadata/similar_recommendations_service.dart lib/pages/details/person_credits_page.dart lib/pages/settings/tvdb_settings_page.dart lib/pages/settings/settings_page.dart lib/pages/search/advanced_discover_page.dart lib/pages/search/search_page.dart lib/services/cache/storage_cache_service.dart lib/services/config/settings_transfer_service.dart lib/pages/settings/torbox_quick_settings_page.dart lib/pages/settings/settings_transfer_page.dart lib/services/player/audio_language_priority.dart lib/services/player/playback_autoselection.dart lib/services/player/paused_http_recovery.dart lib/services/player/automatic_skip_policy.dart lib/services/player/playback_diagnostics_probe.dart lib/widgets/player/player_diagnostics_overlay.dart lib/services/player/skip_segments_service.dart lib/models/player/skip_segment_model.dart lib/widgets/player/player_skip_button.dart lib/widgets/player/player_transport.dart lib/widgets/player/player_top_bar.dart lib/utils/navigation/media_details_navigation.dart lib/services/config/build_identity.dart lib/models/movie/movie.dart lib/services/metadata/bestsimilar_scraper.dart lib/services/metadata/metadata_service.dart lib/widgets/movie/movie_card.dart lib/models/movie/movie_section.dart lib/pages/catalog/catalog_page.dart lib/services/home/home_page_settings.dart lib/widgets/movie/movie_slider_section.dart lib/services/updater/app_updater_service.dart lib/pages/settings/about_settings_page.dart lib/pages/settings/updates_settings_page.dart lib/pages/player/player_screen.dart lib/services/player/player_settings.dart lib/services/player/player_picture_audio.dart lib/services/config/windows_settings_recovery.dart lib/services/player/windows_playback_telemetry.dart lib/services/player/night_mode_diagnostics.dart lib/widgets/player/player_night_mode_recovery.dart lib/widgets/player/player_transport.dart lib/widgets/player/player_brightness_menu.dart lib/services/player/windows_whisper_transcriber.dart lib/services/player/subtitle_auto_sync_policy.dart lib/services/player/mpv_speech_audio_capture.dart lib/services/player/ffmpeg_speech_audio_capture.dart lib/pages/player/watch_screen.dart lib/pages/details/details_page.dart lib/services/my_list/my_list_service.dart lib/services/my_list/github_library_cloud.dart lib/models/my_list/my_list_item.dart lib/services/continue_watching/github_progress_cloud.dart lib/services/continue_watching/continue_watching_service.dart lib/services/continue_watching/watched_history_service.dart lib/services/continue_watching/github_watched_history_cloud.dart lib/services/continue_watching/github_sync_transport.dart lib/widgets/home/continue_watching_slider.dart lib/pages/settings/github_library_settings_page.dart lib/services/my_list/trakt_cloud_library.dart lib/services/my_list/trakt_merge_plan.dart lib/services/trakt/trakt_service.dart lib/pages/my_list/my_list_page.dart lib/pages/settings/trakt_settings_page.dart lib/pages/settings/simkl_settings_page.dart lib/services/simkl/simkl_service.dart lib/services/storage/storage_service.dart lib/services/config/env_service.dart lib/services/my_list/simkl_hearts_cloud.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Supply official verified TorrServer Windows binary
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "torrserver-official-windows"
          New-Item -Force -ItemType Directory -Path $dir | Out-Null
          $binary = Join-Path $dir "torrserver.exe"
          $url = "https://github.com/YouROK/TorrServer/releases/download/MatriX.147.1/TorrServer-windows-amd64.exe"
          Invoke-WebRequest -Uri $url -OutFile $binary -MaximumRedirection 8
          if (!(Test-Path $binary)) { throw "Official TorrServer binary download failed" }
          $sha = (Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne "e99ff2db56b3f43f66804ce0de6d199e3757dcc6062dba75974a462dad275a1c") {
            throw "Official TorrServer Windows binary SHA256 verification failed"
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "TORRSERVER_FLUTTER_LOCAL_BINARIES=$dir"
          Write-Host "Verified official Windows executable, staged for plugin packaging."

      - name: Verify nested details navigation and Discover scroll position
        shell: pwsh
        run: |
          $details = Get-Content "lib/pages/details/details_page.dart" -Raw
          $discover = Get-Content "lib/pages/search/advanced_discover_page.dart" -Raw
          if ($details.Contains("Navigator.pushReplacement(")) { throw "Nested details navigation replaces route" }
          if (!$discover.Contains("controller: _discoverScroll")) { throw "Discover scrolling was not carried over" }
          if ($discover.Contains("oldMaxExtent + 160.0")) { throw "Obsolete Load More forced scroll must stay removed" }
          if (!$discover.Contains("if (loading && !applied)")) { throw "Initial Discover loading indicator missing" }
          if (!$discover.Contains("openingId == item.tmdbId")) { throw "Selected card spinner missing" }
          if ($discover.Contains("if ((loading && !applied) || openingId != null)")) { throw "Global loading must not shift grid when opening a card" }

      - name: Build Windows executable
        shell: pwsh
        run: |
          flutter build windows --release --build-name=1.1.15 --build-number="${{ github.run_number }}" --dart-define=PLAYTORRIO_COMMIT="${{ github.sha }}" --dart-define=PLAYTORRIO_RUN="${{ github.run_number }}" --dart-define-from-file=.env
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path "build/windows/x64/runner/Release/playtorrio.exe")) {
            throw "Windows executable was not created"
          }

      - name: Pin full-featured Windows libmpv with FFmpeg acompressor
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # The previous media_kit_libs_windows_video 1.0.11 libmpv had
          # no FFmpeg acompressor. The owner-provided Build #151 log confirmed:
          # AVFilterGraph: No such filter: 'acompressor'.
          # Replace only the *packaged Windows* DLL, not the Flutter/iOS code.
          $upstream = "https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261021/mpv-dev-x86_64-20261021-git-e471496c56.7z"
          $expectedSha256 = "efc719eff3dc5954b4a5efc800632808bcec01cc9034940dd14e5eb7fe9ea633"
          $archive = Join-Path $env:RUNNER_TEMP "playtorrio-libmpv-20261021.7z"
          $expanded = Join-Path $env:RUNNER_TEMP "playtorrio-libmpv-20261021"
          Invoke-WebRequest -Uri $upstream -OutFile $archive -MaximumRedirection 8
          $actualSha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "Pinned full-filter Windows libmpv archive SHA256 mismatch"
          }
          $sevenZip = "C:/Program Files/7-Zip/7z.exe"
          if (!(Test-Path $sevenZip)) {
            $cmd = Get-Command 7z -ErrorAction SilentlyContinue
            if ($null -eq $cmd) { throw "7-Zip is required to inspect verified libmpv archive" }
            $sevenZip = $cmd.Source
          }
          New-Item -Force -ItemType Directory -Path $expanded | Out-Null
          & $sevenZip x "-o$expanded" "-y" $archive | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Failed to extract pinned libmpv archive" }
          $dlls = @(Get-ChildItem -LiteralPath $expanded -Filter "libmpv-2.dll" -Recurse -File)
          if ($dlls.Count -ne 1) {
            throw "Expected exactly one libmpv-2.dll in pinned upstream archive, got $($dlls.Count)"
          }
          $dest = "build/windows/x64/runner/Release"
          if (!(Test-Path "$dest/playtorrio.exe")) { throw "Windows executable missing" }
          Copy-Item -LiteralPath $dlls[0].FullName -Destination "$dest/libmpv-2.dll" -Force
          if ((Get-Item "$dest/libmpv-2.dll").Length -lt 5000000) {
            throw "Pinned libmpv is unexpectedly small; refusing packaging"
          }
          $runtimeManifest = @(
            "Windows playback library: libmpv-2.dll"
            "Exact upstream mpv-winbuild-cmake release: 20261021"
            "Source repository: https://github.com/shinchiro/mpv-winbuild-cmake"
            "Corresponding mpv and FFmpeg source/build recipes: https://github.com/shinchiro/mpv-winbuild-cmake/tree/20261021"
            "Binary archive: mpv-dev-x86_64-20261021-git-e471496c56.7z"
            "Archive SHA256: efc719eff3dc5954b4a5efc800632808bcec01cc9034940dd14e5eb7fe9ea633"
            "Reason: Windows libmpv must contain FFmpeg acompressor for Night Mode."
            "Real packaged DLL is tested separately on PCM and E-AC3; no silent fallback."
          )
          $runtimeManifest | Set-Content -LiteralPath "$dest/MPV_RUNTIME_SOURCE.txt" -Encoding utf8
          Write-Host "Pinned Windows libmpv verified, staged, full compressor smoke is mandatory."

      - name: Build and bundle offline whisper.cpp CPU CLI for Windows
        shell: pwsh
        run: |
          git clone --depth 1 --branch v1.9.5 https://github.com/ggml-org/whisper.cpp.git "$env:RUNNER_TEMP/whisper-src"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $src = Join-Path $env:RUNNER_TEMP "whisper-src"
          $build = Join-Path $src "build-playtorrio"
          cmake -S "$src" -B "$build" -A x64 -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=ON -DGGML_NATIVE=OFF -DGGML_BACKEND_DL=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build "$build" --config Release --target whisper-cli --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Get-ChildItem "$build" -Filter "whisper-cli.exe" -Recurse | Where-Object { $_.FullName -match "Release" } | Select-Object -First 1
          if ($null -eq $exe) { throw "Whisper CLI executable missing" }
          $dest = "build/windows/x64/runner/Release/whisper"
          New-Item -ItemType Directory -Path "$dest" -Force | Out-Null
          Copy-Item "$($exe.FullName)" "$dest/whisper-cli.exe" -Force
          Get-ChildItem "$build" -Filter "*.dll" -Recurse | Where-Object { $_.FullName -match "Release" } |
            ForEach-Object { Copy-Item $_.FullName "$dest/$($_.Name)" -Force }
          Copy-Item "$src/LICENSE" "$dest/WHISPER-LICENSE.txt" -Force
          if (!(Test-Path "$dest/whisper-cli.exe")) { throw "Whisper missing from packaged app" }
          & "$dest/whisper-cli.exe" --help
          if ($LASTEXITCODE -ne 0) { throw "Bundled Whisper CLI cannot start" }

      - name: Bundle pinned LGPL FFmpeg for robust Windows MKV/Torrentio speech extraction
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-25-13-00/ffmpeg-n9.0.2-36-g6882969ce9-win64-lgpl-9.0.zip"
          $expected = "47526345cc4800f4163337d5db8048a2d06c78a53bb234532f55a30dbfb49868"
          $archive = Join-Path $env:RUNNER_TEMP "playtorrio-ffmpeg-lgpl.zip"
          $expanded = Join-Path $env:RUNNER_TEMP "playtorrio-ffmpeg-lgpl-expanded"
          Invoke-WebRequest -Uri $url -OutFile $archive -MaximumRedirection 8
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Pinned LGPL FFmpeg ZIP checksum mismatch" }
          Expand-Archive -LiteralPath $archive -DestinationPath $expanded -Force
          $exe = Get-ChildItem $expanded -Recurse -File -Filter "ffmpeg.exe" | Select-Object -First 1
          if ($null -eq $exe) { throw "Pinned FFmpeg ZIP contains no executable" }
          $dest = "build/windows/x64/runner/Release/ffmpeg"
          New-Item -Force -ItemType Directory -Path $dest | Out-Null
          Copy-Item -LiteralPath $exe.FullName -Destination "$dest/ffmpeg.exe" -Force
          $licences = Get-ChildItem $expanded -Recurse -File | Where-Object { $_.Name -match '^(COPYING|LICENSE)' }
          foreach ($notice in $licences) {
            $target = Join-Path $dest ($notice.Name -replace '[^A-Za-z0-9._-]', '_')
            if (!(Test-Path $target)) { Copy-Item -LiteralPath $notice.FullName -Destination $target }
          }
          @'
          FFmpeg LGPL unmodified Windows command-line executable
          Project: https://ffmpeg.org/
          Upstream build: https://github.com/BtbN/FFmpeg-Builds
          Pinned release: autobuild-2026-10-25-13-00
          Pinned artifact: ffmpeg-n9.0.2-36-g6882969ce9-win64-lgpl-9.0.zip
          SHA-256 of original ZIP: 47526345cc4800f4163337d5db8048a2d06c78a53bb234532f55a30dbfb49868
          Licencing: LGPL variant; see FFmpeg legal notices and source at https://ffmpeg.org/legal.html
          '@ | Set-Content -LiteralPath "$dest/FFMPEG-PROVENANCE.txt" -Encoding utf8
          & "$dest/ffmpeg.exe" -version
          if ($LASTEXITCODE -ne 0) { throw "Bundled FFmpeg failed to start" }

      - name: Verify packaged libmpv PCM, E-AC3 compressor and video-brightness filters
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dest = "build/windows/x64/runner/Release"
          $dll = Join-Path $dest "libmpv-2.dll"
          $testDir = Join-Path $env:RUNNER_TEMP "playtorrio-native-compressor-smoke"
          New-Item -Force -ItemType Directory -Path $testDir | Out-Null
          $pcm = Join-Path $testDir "night-mode-test.wav"
          $eac3 = Join-Path $testDir "night-mode-test.eac3"
          python .github/scripts/verify_night_mode_libmpv.py --generate-sample "$pcm"
          if ($LASTEXITCODE -ne 0) { throw "Could not generate test PCM sample" }
          python .github/scripts/verify_night_mode_libmpv.py --libmpv "$dll" --sample "$pcm"
          if ($LASTEXITCODE -ne 0) {
            throw "PACKAGED Windows libmpv cannot initialize real Night Mode compressor on PCM"
          }
          $ffmpeg = Join-Path $dest "ffmpeg/ffmpeg.exe"
          & $ffmpeg -hide_banner -loglevel error -y -i "$pcm" -ac 6 -ar 48000 -c:a eac3 -b:a 384k "$eac3"
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $eac3)) { throw "E-AC3 sample encoding failed" }
          python .github/scripts/verify_night_mode_libmpv.py --libmpv "$dll" --sample "$eac3"
          if ($LASTEXITCODE -ne 0) {
            throw "PACKAGED Windows libmpv cannot initialize Night Mode on E-AC3"
          }
          # Video uses synthetic local RGB frames, not the owner's media.
          $video = Join-Path $testDir "brightness-test.avi"
          & $ffmpeg -hide_banner -nostdin -loglevel error -y -f lavfi -i "testsrc=size=320x180:rate=24:duration=2" -an -pix_fmt yuv420p -c:v mpeg4 "$video"
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $video)) { throw "Could not synthesize video EQ test" }
          python .github/scripts/verify_night_mode_libmpv.py --libmpv "$dll" --sample "$video" --video-smoke
          if ($LASTEXITCODE -ne 0) { throw "PACKAGED Windows libmpv rejected live video brightness EQ" }
          Write-Host "PASS: shipped Windows libmpv supports acompressor + alimiter on PCM/E-AC3 and video EQ on synthetic frames"

      - name: Native Windows FFmpeg decode-to-Whisper-WAV regression (no network/media credentials)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ff = "build/windows/x64/runner/Release/ffmpeg/ffmpeg.exe"
          $source = Join-Path $env:RUNNER_TEMP "speech-test-mkv.mka"
          $wav = Join-Path $env:RUNNER_TEMP "speech-test-16khz.wav"
          & $ff -hide_banner -nostdin -loglevel error -y -f lavfi -i "sine=frequency=440:sample_rate=48000:duration=22" -c:a flac $source
          if ($LASTEXITCODE -ne 0) { throw "Could not generate simulated MKV audio" }
          & $ff -hide_banner -nostdin -loglevel error -y -ss 5.000 -i $source -t 3.000 -map 0:a:0 -vn -sn -dn -ac 1 -ar 16000 -c:a pcm_s16le -f wav $wav
          if ($LASTEXITCODE -ne 0) { throw "FFmpeg failed MKV-like source extraction" }
          $bytes = [System.IO.File]::ReadAllBytes($wav)
          if ($bytes.Length -lt 65536) { throw "Extracted WAV too small" }
          if ([System.Text.Encoding]::ASCII.GetString($bytes, 0, 4) -ne "RIFF") { throw "Bad WAV header" }
          if ([BitConverter]::ToInt32($bytes, 24) -ne 16000) { throw "Wrong Whisper sample rate" }
          if ([BitConverter]::ToInt16($bytes, 22) -ne 1) { throw "Wrong Whisper channel count" }
          if ([BitConverter]::ToInt16($bytes, 34) -ne 16) { throw "Wrong Whisper sample format" }
          Write-Host "Real bundled FFmpeg decoded a seeked MKV-like audio source to valid Whisper WAV."

      - name: End-to-end offline Whisper recognition regression using real English speech
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $model = Join-Path $env:RUNNER_TEMP "ggml-base.en.bin"
          $url = "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en.bin"
          Invoke-WebRequest -Uri $url -OutFile $model -MaximumRedirection 8
          if ((Get-Item $model).Length -ne 147964211) { throw "English model has incorrect size" }
          $sha = (Get-FileHash -LiteralPath $model -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne "a03779c86df3323075f5e796cb2ce5029f00ec8869eee3fdfb897afe36c6d002") {
            throw "English model checksum mismatch"
          }
          $src = Join-Path $env:RUNNER_TEMP "whisper-src"
          $speech = Join-Path $src "samples/jfk.wav"
          if (!(Test-Path $speech)) { throw "Speech fixture missing from pinned whisper.cpp release" }
          $output = Join-Path $env:RUNNER_TEMP "whisper-real-speech"
          $cli = "build/windows/x64/runner/Release/whisper/whisper-cli.exe"
          & $cli -m $model -f $speech -l en -ml 1 -sow -oj -of $output -t 4 -np
          if ($LASTEXITCODE -ne 0) { throw "Whisper CLI could not recognize the real speech fixture" }
          if (!(Test-Path "$output.json")) { throw "Whisper produced no timestamped JSON" }
          $json = Get-Content "$output.json" -Raw | ConvertFrom-Json
          $words = @($json.transcription)
          if ($words.Count -lt 8) { throw "Whisper produced too few timed words" }
          $spoken = ($words | ForEach-Object { $_.text }) -join ' '
          if ($spoken -notmatch '(?i)country') { throw "Whisper failed to recognize the fixture's dialogue" }
          if (@($words | Where-Object { $_.offsets.from -ge 0 }).Count -lt 8) {
            throw "Whisper recognition timestamps are missing"
          }
          Write-Host "Real English speech was recognized offline with valid timed JSON; model SHA verified."

      - name: Package portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "PlayTorrio-Windows-x64-Portable.zip" -Force
          if (!(Test-Path "PlayTorrio-Windows-x64-Portable.zip")) { throw "Portable ZIP missing" }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build direct Windows installer EXE
        shell: pwsh
        run: |
          $compiler = "C:/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if (!(Test-Path $compiler)) {
            $compiler = "C:/Program Files/Inno Setup 6/ISCC.exe"
          }
          if (!(Test-Path $compiler)) { throw "Inno Setup compiler missing" }
          New-Item -Force -ItemType Directory -Path "installer/windows/Output" | Out-Null
          & $compiler "/DMyAppVersion=1.1.15" "/DMyAppBuild=${{ github.run_number }}" "installer/windows/setup.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "installer/windows/Output/PlayTorrio-Windows-Setup.exe" "PlayTorrio-Windows-Setup.exe" -Force
          if (!(Test-Path "PlayTorrio-Windows-Setup.exe")) { throw "Installer missing" }

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: PlayTorrio-Windows-v1.1.15-build-${{ github.run_number }}
          path: |
            PlayTorrio-Windows-Setup.exe
            PlayTorrio-Windows-x64-Portable.zip
          if-no-files-found: error
          retention-days: 3

  ios15:
    name: iOS 15 — build and sign TrollStore IPA
    if: ${{ github.ref == 'refs/heads/parity-floating-player-both' && !contains(github.event.head_commit.message, '[windows-only]') }}
    # Explicit Intel macOS pool avoids repeated ARM macos-latest runner starvation.
    # Confirmed macos-15-intel allocated a runner for isolated #145 recovery.
    runs-on: macos-15-intel
    timeout-minutes: 100
    # Reuse the exact same, source-pinned tests/build/signing steps on backup runners.
    steps: &ios_build_steps
      - name: Checkout source (recoverable network step)
        id: ios_checkout
        uses: actions/checkout@v4
        # Checkout already retries internally. One extra retry in the SAME job
        # can recover transient github.com DNS failure without a native rebuild.
        continue-on-error: true

      - name: Retry source checkout if GitHub DNS/network was unavailable
        if: steps.ios_checkout.outcome == 'failure'
        uses: actions/checkout@v4

      - name: Verify iOS checkout matches the triggering commit
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "iOS 15 build commit: $GITHUB_SHA"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Setup Flutter dependencies
        run: |
          touch .env
          flutter pub get

      - name: Restore iOS TorrServerKit framework
        run: |
          mkdir -p "$RUNNER_TEMP/torrserver-ios15"
          curl --fail --show-error --location --retry 3 \
            "https://github.com/MrSergo15/torrserver_flutter/releases/download/linux-macos-torrserver-fix-test/TorrServerKit.xcframework.zip" \
            -o "$RUNNER_TEMP/torrserver-ios15/TorrServerKit.xcframework.zip"
          unzip -t "$RUNNER_TEMP/torrserver-ios15/TorrServerKit.xcframework.zip" >/dev/null
          unzip -q "$RUNNER_TEMP/torrserver-ios15/TorrServerKit.xcframework.zip" \
            -d "$RUNNER_TEMP/torrserver-ios15"
          test -d "$RUNNER_TEMP/torrserver-ios15/TorrServerKit.xcframework"
          echo "TORRSERVER_FLUTTER_LOCAL_BINARIES=$RUNNER_TEMP/torrserver-ios15" >> "$GITHUB_ENV"

      - name: Inspect native framework platforms
        run: |
          python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path
          root = Path(os.environ['TORRSERVER_FLUTTER_LOCAL_BINARIES']) / 'TorrServerKit.xcframework'
          with (root / 'Info.plist').open('rb') as f:
              info = plistlib.load(f)
          print('Native framework slices:', info.get('AvailableLibraries'))
          if not any(
              entry.get('SupportedPlatform') == 'ios' and
              'arm64' in entry.get('SupportedArchitectures', []) and
              not entry.get('SupportedPlatformVariant')
              for entry in info.get('AvailableLibraries', [])
          ):
              raise SystemExit('TorrServerKit is missing iOS arm64 device support')
          PY

      - name: Analyze storage code
        run: |
          flutter analyze --no-pub --no-fatal-infos \
            lib/services/cache/storage_cache_service.dart \
            lib/pages/settings/storage_settings_page.dart \
            lib/services/config/settings_transfer_service.dart \
            lib/pages/settings/settings_transfer_page.dart \
            lib/pages/settings/torbox_quick_settings_page.dart \
            lib/pages/settings/settings_page.dart \
            lib/pages/settings/github_library_settings_page.dart \
            lib/services/my_list/github_library_cloud.dart lib/models/my_list/my_list_item.dart \
            lib/services/continue_watching/github_progress_cloud.dart \
            lib/services/continue_watching/continue_watching_service.dart \
            lib/services/continue_watching/watched_history_service.dart \
            lib/services/continue_watching/github_watched_history_cloud.dart \
            lib/services/continue_watching/github_sync_transport.dart \
            lib/widgets/home/continue_watching_slider.dart \
            lib/services/my_list/my_list_service.dart \
            lib/pages/my_list/my_list_page.dart \
            lib/services/addon/addon_manager.dart \
            lib/services/player/audio_language_priority.dart \
            lib/services/player/playback_autoselection.dart \
            lib/services/player/paused_http_recovery.dart \
            lib/services/player/automatic_skip_policy.dart \
            lib/services/player/playback_diagnostics_probe.dart \
            lib/widgets/player/player_diagnostics_overlay.dart \
            lib/services/player/skip_segments_service.dart \
            lib/models/player/skip_segment_model.dart \
            lib/widgets/player/player_skip_button.dart \
            lib/widgets/player/player_transport.dart \
            lib/widgets/player/player_top_bar.dart \
            lib/utils/navigation/media_details_navigation.dart \
            lib/services/config/build_identity.dart \
            lib/models/movie/movie.dart \
            lib/services/metadata/bestsimilar_scraper.dart \
            lib/services/metadata/metadata_service.dart \
            lib/widgets/movie/movie_card.dart \
            lib/models/movie/movie_section.dart \
            lib/pages/catalog/catalog_page.dart \
            lib/services/home/home_page_settings.dart \
            lib/widgets/movie/movie_slider_section.dart \
            lib/services/updater/app_updater_service.dart \
            lib/pages/settings/about_settings_page.dart \
            lib/pages/settings/updates_settings_page.dart \
            lib/services/player/player_settings.dart \
            lib/pages/player/player_screen.dart \
            lib/pages/player/watch_screen.dart \
            lib/services/metadata/tmdb_discover_service.dart \
            lib/services/metadata/title_origin_language_service.dart lib/services/metadata/series_run_service.dart lib/widgets/movie/series_year_label.dart \
            lib/models/movie/movie_detail.dart \
            lib/pages/discover/discover_page.dart \
            lib/services/metadata/network_discover_service.dart \
            lib/pages/networks/networks_page.dart \
            lib/services/theme/dock_settings.dart \
            lib/widgets/common/app_liquid_dock.dart \
            lib/services/metadata/tvdb_series_service.dart \
            lib/services/metadata/similar_recommendations_service.dart \
            lib/pages/details/person_credits_page.dart \
            lib/pages/settings/tvdb_settings_page.dart \
            lib/pages/search/advanced_discover_page.dart \
            lib/pages/search/search_page.dart \
            lib/pages/details/details_page.dart

      - name: Test GitHub library and cross-device playback progress
        run: |
          flutter test test/github_progress_merge_test.dart
          flutter test test/github_progress_v1_compat_test.dart
          flutter test test/github_sync_gate_test.dart
          flutter test test/github_watched_history_merge_test.dart
          flutter test test/github_watchlist_v1_regression_test.dart
          flutter test test/github_library_merge_test.dart
          flutter test test/services/my_list_service_test.dart

      - name: Test TV Series vs Movie recommendations on iOS
        run: flutter test test/recommendation_media_type_test.dart

      - name: Verify TVDB key option is discoverable in iOS Settings
        run: flutter test test/tvdb_settings_navigation_test.dart

      - name: Validate TVDB key probe, completed history and TMDB personalized fallback
        run: |
          flutter test test/tvdb_credentials_validation_test.dart
          flutter test test/watched_history_recommendations_test.dart
          flutter test test/tmdb_personalized_fallback_test.dart

      - name: Test optional movie and TV title search with combined filters
        run: |
          flutter test test/tmdb_text_filter_search_test.dart
          flutter test test/advanced_discover_text_ui_test.dart

      - name: Test cast-person filmography and rich similar-card metadata
        run: |
          flutter test test/person_filmography_test.dart
          flutter test test/similar_card_metadata_test.dart
          flutter test test/cast_similar_navigation_ui_test.dart

      - name: Test streaming service and TV networks browsing
        run: |
          flutter test test/network_discover_service_test.dart
          flutter test test/networks_navigation_ui_test.dart

      - name: Test genuine source-bound See All on iOS
        run: |
          flutter test test/curated_recommendations_see_all_test.dart
          flutter test test/see_all_source_integrity_test.dart
          flutter test test/title_origin_language_test.dart
          flutter test test/origin_language_everywhere_test.dart

      - name: Test player and Continue Watching Show Details actions
        run: flutter test test/show_details_navigation_test.dart

      - name: Verify cancelable TV intro and credits auto-skip
        run: flutter test test/series_automatic_skip_test.dart

      - name: Verify playback diagnostics overlay
        run: flutter test test/player_diagnostics_overlay_test.dart

      - name: Test English-audio priority
        run: flutter test test/audio_language_priority_test.dart

      - name: Test English subtitles and continuous episode selection
        run: flutter test test/playback_autoselection_test.dart

      - name: Check nested details history and Discover scroll preservation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          details = Path('lib/pages/details/details_page.dart').read_text()
          discover = Path('lib/pages/search/advanced_discover_page.dart').read_text()
          assert 'Navigator.pushReplacement(' not in details, 'Details page replaces its history'
          assert 'Navigator.push(' in details
          assert 'controller: _discoverScroll' in discover
          assert '_discoverScroll.animateTo(' not in discover
          assert 'if (loading && !applied)' in discover, 'Initial Discover loading indicator missing'
          assert 'openingId == item.tmdbId' in discover, 'Selected-card spinner missing'
          assert 'if ((loading && !applied) || openingId != null)' not in discover, 'Global spinner shifts the grid on card click'
          assert 'PageStorageKey' in discover
          print('Nested details history and stable pagination verified')
          PY

      - name: Test TMDB Discover filters and year matching
        run: |
          flutter test test/tmdb_advanced_discover_test.dart
          flutter test test/series_run_service_test.dart
          flutter test test/discover_year_pagination_widget_test.dart

      - name: Test polite TV recommendations and optional TVDB enrichment
        run: |
          flutter test test/tmdb_rate_limit_test.dart
          flutter test test/similar_recommendations_test.dart

      - name: Build unsigned iOS 15 release
        run: flutter build ios --release --no-codesign --build-name=1.1.15 --build-number="${{ github.run_number }}" --dart-define=PLAYTORRIO_COMMIT="${{ github.sha }}" --dart-define=PLAYTORRIO_RUN="${{ github.run_number }}" --dart-define-from-file=.env

      - name: Verify minimum iOS 15
        run: |
          test -d build/ios/iphoneos/Runner.app
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          info = Path('build/ios/iphoneos/Runner.app/Info.plist')
          with info.open('rb') as f:
              version = plistlib.load(f).get('MinimumOSVersion', '')
          print('App minimum iOS version:', version)
          if not version or tuple(map(int, version.split('.'))) > (15, 0):
              raise SystemExit('Build is not compatible with iOS 15')
          PY

      - name: Ad hoc sign for TrollStore
        run: |
          codesign --force --deep --sign - --timestamp=none build/ios/iphoneos/Runner.app
          codesign --verify --deep --strict --verbose=2 build/ios/iphoneos/Runner.app

      - name: Package IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -qry PlayTorrio-iOS15-TrollStore.ipa Payload
          test -s PlayTorrio-iOS15-TrollStore.ipa

      - name: Verify TrollStore IPA archive and app signing
        run: |
          python3 - <<'PY'
          import hashlib, plistlib, zipfile
          from pathlib import Path
          ipa = Path('build/ios/ipa/PlayTorrio-iOS15-TrollStore.ipa')
          if not ipa.is_file() or ipa.stat().st_size == 0:
              raise SystemExit('Missing IPA archive')
          with zipfile.ZipFile(ipa) as archive:
              if archive.testzip() is not None:
                  raise SystemExit('IPA archive is corrupt')
              names = archive.namelist()
              info = plistlib.loads(archive.read('Payload/Runner.app/Info.plist'))
              minimum = tuple(map(int, info['MinimumOSVersion'].split('.')))
              if minimum > (15, 0):
                  raise SystemExit(f'IPA requires iOS {minimum}, not compatible with iOS 15.0')
              if 2 not in info['UIDeviceFamily']:
                  raise SystemExit('IPA does not support iPad')
              if 'Payload/Runner.app/_CodeSignature/CodeResources' not in names:
                  raise SystemExit('Missing ad hoc code signature in packaged IPA')
              print('IPA bundle:', info['CFBundleIdentifier'])
              print('Minimum iOS:', info['MinimumOSVersion'])
              print('iOS build number:', info['CFBundleVersion'])
          print('SHA256:', hashlib.sha256(ipa.read_bytes()).hexdigest())
          PY

      - name: Upload signed iOS 15 TrollStore IPA
        uses: actions/upload-artifact@v4
        with:
          name: PlayTorrio-iOS15-TrollStore-v1.1.15-build-${{ github.run_number }}
          path: build/ios/ipa/PlayTorrio-iOS15-TrollStore.ipa
          if-no-files-found: error
          retention-days: 3

  ios15-allocation-check:
    name: Verify iOS 15 — build and sign TrollStore IPA had no assigned Mac runner
    needs: [windows, ios15]
    if: ${{ always() && !cancelled() && needs.windows.result == 'success' && needs.ios15.result == 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      actions: read
      contents: read
    outputs:
      eligible: ${{ steps.guard.outputs.eligible }}
    steps:
      - uses: actions/checkout@v4
      - name: Check cancelled job, no runner, no steps and no signed IPA
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_JOB_NAME: "iOS 15 — build and sign TrollStore IPA"
          APP_VERSION: "1.1.15"
        run: python3 .github/scripts/ios_runner_fallback_guard.py

  ios15-rescue-intel:
    name: iOS 15 — backup Intel runner
    needs: [windows, ios15, ios15-allocation-check]
    if: ${{ always() && !cancelled() && needs.ios15-allocation-check.outputs.eligible == 'true' }}
    # Different macOS image/runner label, still 14 GB Intel hardware.
    runs-on: macos-26-intel
    timeout-minutes: 100
    steps: *ios_build_steps

  ios15-rescue-allocation-check:
    name: Verify iOS 15 — backup Intel runner had no assigned Mac runner
    needs: [windows, ios15-rescue-intel]
    if: ${{ always() && !cancelled() && needs.windows.result == 'success' && needs.ios15-rescue-intel.result == 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      actions: read
      contents: read
    outputs:
      eligible: ${{ steps.guard.outputs.eligible }}
    steps:
      - uses: actions/checkout@v4
      - name: Check cancelled job, no runner, no steps and no signed IPA
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_JOB_NAME: "iOS 15 — backup Intel runner"
          APP_VERSION: "1.1.15"
        run: python3 .github/scripts/ios_runner_fallback_guard.py

  ios15-rescue-arm:
    name: iOS 15 — emergency Apple Silicon runner
    needs: [windows, ios15-rescue-intel, ios15-rescue-allocation-check]
    if: ${{ always() && !cancelled() && needs.ios15-rescue-allocation-check.outputs.eligible == 'true' }}
    # Last resort: a separate M-series runner pool. Never triggered by test or signing failures.
    runs-on: macos-15
    timeout-minutes: 100
    steps: *ios_build_steps

  telegram-windows:
    name: Send Windows setup EXE to Telegram (independent)
    needs: [windows]
    if: github.ref == 'refs/heads/parity-floating-player-both'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHANNEL_ID || vars.TELEGRAM_CHANNEL_ID || '-1003938575195' }}
      BUILD_SHA: ${{ github.sha }}
      BUILD_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Download Windows installer and portable ZIP
        uses: actions/download-artifact@v4
        with:
          name: PlayTorrio-Windows-v1.1.15-build-${{ github.run_number }}
          path: packages/windows
      - name: Send actual Windows setup EXE in its own Telegram message
        env:
          BUILD_VERSION: "1.1.15"
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python3 .github/scripts/telegram_ci.py send-document \
            --platform Windows \
            --file packages/windows/PlayTorrio-Windows-Setup.exe \
            --release-notes-file .github/release-notes.txt \
            --caption-extra "Windows portable ZIP and SHA256 checksums are available in this build's permanent GitHub Release."

  telegram-ipa:
    name: Post signed iOS 15 TrollStore IPA to Telegram
    needs: [ios15, ios15-rescue-intel, ios15-rescue-arm]
    # Exactly one sender, irrespective of which Mac runner produced the signed IPA.
    if: ${{ always() && !cancelled() && github.ref == 'refs/heads/parity-floating-player-both' && (needs.ios15.result == 'success' || needs.ios15-rescue-intel.result == 'success' || needs.ios15-rescue-arm.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHANNEL_ID || vars.TELEGRAM_CHANNEL_ID || '-1003938575195' }}
      BUILD_SHA: ${{ github.sha }}
      BUILD_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Download signed IPA from this workflow run
        uses: actions/download-artifact@v4
        with:
          name: PlayTorrio-iOS15-TrollStore-v1.1.15-build-${{ github.run_number }}
          path: packages/ios15

      - name: Send actual iOS 15 signed IPA in its own Telegram message
        timeout-minutes: 10
        env:
          BUILD_VERSION: "1.1.15"
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python3 .github/scripts/telegram_ci.py send-document \
            --platform "iOS 15 TrollStore" \
            --file packages/ios15/PlayTorrio-iOS15-TrollStore.ipa \
            --release-notes-file .github/release-notes.txt \
            --require-document

  publish-paired:
    name: Publish matched Windows and iOS 15 builds
    needs: [windows, ios15, ios15-rescue-intel, ios15-rescue-arm]
    # Publish original Windows and the sole successfully signed iOS artifact.
    if: ${{ always() && !cancelled() && !contains(github.event.head_commit.message, '[windows-only]') && github.ref == 'refs/heads/parity-floating-player-both' && needs.windows.result == 'success' && (needs.ios15.result == 'success' || needs.ios15-rescue-intel.result == 'success' || needs.ios15-rescue-arm.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify publishing checkout is pinned to this release
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -s .github/release-notes.txt

      - name: Download Windows build from this workflow run
        uses: actions/download-artifact@v4
        with:
          name: PlayTorrio-Windows-v1.1.15-build-${{ github.run_number }}
          path: packages/windows

      - name: Download TrollStore IPA from this workflow run
        uses: actions/download-artifact@v4
        with:
          name: PlayTorrio-iOS15-TrollStore-v1.1.15-build-${{ github.run_number }}
          path: packages/ios15

      - name: Verify both packages belong to this build
        run: |
          test -s packages/windows/PlayTorrio-Windows-Setup.exe
          test -s packages/windows/PlayTorrio-Windows-x64-Portable.zip
          test -s packages/ios15/PlayTorrio-iOS15-TrollStore.ipa
          echo "Matched Windows and iOS 15 packages for commit $GITHUB_SHA"
          sha256sum packages/windows/* packages/ios15/*

      - name: Publish uniquely versioned Windows and TrollStore releases
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: "1.1.15"
        run: |
          set -euo pipefail
          TAG="build-v$APP_VERSION-b$GITHUB_RUN_NUMBER"
          BASENAME="PlayTorrio-v$APP_VERSION-build$GITHUB_RUN_NUMBER"
          mkdir -p release
          cp packages/windows/PlayTorrio-Windows-Setup.exe "release/$BASENAME-Windows-Setup.exe"
          cp packages/windows/PlayTorrio-Windows-x64-Portable.zip "release/$BASENAME-Windows-x64-Portable.zip"
          cp packages/ios15/PlayTorrio-iOS15-TrollStore.ipa "release/$BASENAME-iOS15-TrollStore.ipa"
          (cd release && sha256sum PlayTorrio-* > SHA256SUMS.txt)
          {
            printf 'PlayTorrio v%s (Build %s)\n\n' "$APP_VERSION" "$GITHUB_RUN_NUMBER"
            printf 'Source revision: %s\n' "$GITHUB_SHA"
            printf '%s\n' 'Windows and signed iOS 15 TrollStore IPA use the same source revision.'
            printf "\nWhat's new / Fixed:\n"
            cat .github/release-notes.txt
          } > release-notes.md
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release tag already exists; only upload missing assets without clobbering files."
            for file in release/*; do
              name=$(basename "$file")
              if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
                  --json assets --jq '.assets[].name' | grep -Fxq "$name"; then
                gh release upload "$TAG" "$file" --repo "$GITHUB_REPOSITORY"
              fi
            done
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "PlayTorrio v$APP_VERSION (Build $GITHUB_RUN_NUMBER)" \
              --notes-file release-notes.md
          else
            gh release create "$TAG" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "PlayTorrio v$APP_VERSION (Build $GITHUB_RUN_NUMBER)" \
              --notes-file release-notes.md --latest
          fi
          # Fail if any direct-download asset is missing, truncated or mismatched.
          for file in release/*; do
            name=$(basename "$file")
            expected=$(stat -c%s "$file")
            actual=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
              --json assets --jq ".assets[] | select(.name == \"$name\") | .size")
            test -n "$actual"
            test "$actual" = "$expected"
          done
          echo "### Published PlayTorrio v$APP_VERSION (Build $GITHUB_RUN_NUMBER)" >> "$GITHUB_STEP_SUMMARY"
          echo "Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"


  publish-windows-only:
    name: Publish Windows-only installer and portable ZIP
    needs: [windows]
    if: ${{ always() && !cancelled() && contains(github.event.head_commit.message, '[windows-only]') && needs.windows.result == 'success' && github.ref == 'refs/heads/parity-floating-player-both' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact checkout and release notes
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -s .github/release-notes.txt
      - name: Download Windows package from this exact native run
        uses: actions/download-artifact@v4
        with:
          name: PlayTorrio-Windows-v1.1.15-build-${{ github.run_number }}
          path: packages/windows
      - name: Publish immutable Windows-only GitHub Release and verify asset sizes
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: "1.1.15"
        run: |
          set -euo pipefail
          test -s packages/windows/PlayTorrio-Windows-Setup.exe
          test -s packages/windows/PlayTorrio-Windows-x64-Portable.zip
          TAG="build-v$APP_VERSION-b$GITHUB_RUN_NUMBER"
          BASENAME="PlayTorrio-v$APP_VERSION-build$GITHUB_RUN_NUMBER"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Refusing to overwrite an existing GitHub release."
            exit 1
          fi
          mkdir -p release
          cp packages/windows/PlayTorrio-Windows-Setup.exe "release/$BASENAME-Windows-Setup.exe"
          cp packages/windows/PlayTorrio-Windows-x64-Portable.zip "release/$BASENAME-Windows-x64-Portable.zip"
          (cd release && sha256sum PlayTorrio-* > SHA256SUMS.txt)
          {
            printf 'PlayTorrio v%s Build %s (Windows x64 only)\n\n' "$APP_VERSION" "$GITHUB_RUN_NUMBER"
            printf 'Source revision: %s\n' "$GITHUB_SHA"
            printf '%s\n' 'This release contains Windows binaries only. The last signed iOS IPA is unchanged.'
            printf "\nWhat's new / Fixed:\n"
            cat .github/release-notes.txt
          } > release-notes.md
          gh release create "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "PlayTorrio v$APP_VERSION (Build $GITHUB_RUN_NUMBER, Windows)" \
            --notes-file release-notes.md --latest
          for file in release/*; do
            name=$(basename "$file")
            expected=$(stat -c%s "$file")
            actual=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
              --json assets --jq ".assets[] | select(.name == \"$name\") | .size")
            test -n "$actual"
            test "$expected" = "$actual"
          done
          echo "Windows-only GitHub Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "Source revision: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"


  prune-release-artifacts:
    name: Reclaim redundant successful-build artifacts (release assets kept)
    needs: [publish-paired, telegram-ipa, telegram-windows]
    if: github.ref == 'refs/heads/parity-floating-player-both'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Prune only older release-verified PlayTorrio workflow artifacts
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: "1.1.15"
        run: python3 .github/scripts/prune_playtorrio_artifacts.py
